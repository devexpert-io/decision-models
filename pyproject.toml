[project]
name = "decision-models"
version = "0.1.0"
description = "Modelos de decisión con ejemplos prácticos: Jev, OpenAI, Perplexity y en local con Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.scripts]
decide = "decisions.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "decisions"
